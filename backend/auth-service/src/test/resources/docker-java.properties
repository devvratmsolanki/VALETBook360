# Override docker-java's default API version (1.32) to a version supported by
# OrbStack's Docker daemon (minimum 1.40). Without this, Testcontainers fails
# with: "client version 1.32 is too old. Minimum supported API version is 1.40"
#
# The shaded DefaultDockerClientConfig inside testcontainers-1.20.4 loads this
# file from the classpath root (/docker-java.properties) and uses it to
# override its hardcoded DEFAULT_API_VERSION constant.
api.version=1.41
