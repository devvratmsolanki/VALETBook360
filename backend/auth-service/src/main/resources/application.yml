spring:
  application:
    name: auth-service

  datasource:
    # stringtype=unspecified lets PostgreSQL coerce the JPA enum's string value
    # into the native user_role enum without a custom Hibernate UserType.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/valet_auth?stringtype=unspecified}
    username: ${DB_USER:valet}
    password: ${DB_PASSWORD:valet}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      # Flyway owns the schema. Never let Hibernate mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    # We use NO Flyway placeholders. Disable replacement so BCrypt hashes in the
    # seed ($2b$12$...) are never misparsed as ${...} placeholders.
    placeholder-replacement: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Redis backs the cluster-safe login rate-limit + per-account lockout counters
  # (INCR + EXPIRE sliding windows). Lettuce connects lazily. If Redis is
  # unreachable the LoginGuard fails OPEN (allows the request) so an infra blip
  # never causes a total login outage — see RedisLoginGuardStore.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    # Never expose stack traces or internal messages via the default error page.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

auth:
  jwt:
    # Shared-contract secret env var is JWT_SECRET (every service that validates
    # these tokens reads the SAME var). AUTH_JWT_SECRET kept as a legacy fallback.
    secret: ${JWT_SECRET:${AUTH_JWT_SECRET:}}
    issuer: ${AUTH_JWT_ISSUER:valet-auth}
    access-ttl-seconds: ${AUTH_JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${AUTH_JWT_REFRESH_TTL:2592000}
  # Login abuse controls (Redis-backed; see LoginGuardService + RateLimitFilter).
  login-guard:
    # Coarse per-IP FAILURE ceiling: only FAILED login attempts increment this
    # counter. Successful logins from the same IP do NOT count, so a shared-egress
    # IP (NAT / corporate proxy / CGNAT) is never blocked by innocent users who
    # happen to share an exit node with a bad actor. The per-account lockout is
    # the precise primary control; this ceiling is a circuit-breaker for genuine
    # credential-stuffing floods (many dozens of failures from one source IP).
    ip-max-attempts: ${AUTH_RL_IP_MAX:100}
    ip-window-seconds: ${AUTH_RL_IP_WINDOW:60}
    # Per-account lockout: after N consecutive failed logins for one email within
    # the window, lock that email for lock-seconds (even with the right password).
    account-max-failures: ${AUTH_LOCK_MAX_FAILURES:5}
    account-window-seconds: ${AUTH_LOCK_WINDOW:900}
    account-lock-seconds: ${AUTH_LOCK_SECONDS:900}
    # Trust the first hop of X-Forwarded-For (a reverse proxy sits in front in
    # prod). Set false if the service is directly internet-exposed (no proxy).
    trust-forwarded-for: ${AUTH_RL_TRUST_XFF:true}

  # Optional one-time first-admin seed (see BootstrapAdminRunner). Empty = no-op.
  bootstrap-admin:
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${AUTH_BOOTSTRAP_ADMIN_NAME:Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
